# Bumps each MojoRecomp release line from the Conventional Commits that changed
# it since its last tag, updates its CHANGELOG, and pushes the release commit
# and tag. Components and their paths are defined in .cz.<component>.toml.
# A new launcher tag is then built and published by launcher-release.yml; tags
# pushed with GITHUB_TOKEN cannot start other workflows on their own.
name: Release bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-bump-${{ github.ref }}
  cancel-in-progress: false

env:
  # Pre-release label for the COT runtime line. Clear it to release stable
  # runtime versions.
  COT_RUNTIME_PRERELEASE: alpha

jobs:
  bump:
    # Pushes made with GITHUB_TOKEN do not start workflows; this guard also
    # covers release commits pushed with another credential.
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(release):') }}
    runs-on: ubuntu-latest
    outputs:
      launcher_tag: ${{ steps.tags.outputs.launcher_tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Commitizen and the MojoRecomp plugin
        run: python -m pip install ./tools/commitizen_mojorecomp

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Record existing launcher tags
        run: git tag --list 'v*' | sort > "$RUNNER_TEMP/launcher-tags-before"

      # Exit code 21 (NO_INCREMENT) means the component has nothing to release.
      - name: Bump launcher
        run: cz --no-raise 21 --config .cz.launcher.toml bump --yes

      - name: Bump COT runtime
        run: |
          prerelease=()
          if [ -n "$COT_RUNTIME_PRERELEASE" ]; then
            prerelease=(--prerelease "$COT_RUNTIME_PRERELEASE")
          fi
          cz --no-raise 21 --config .cz.cot-runtime.toml bump --yes "${prerelease[@]}"

      - name: Push release commits and tags
        run: git push --atomic --follow-tags origin "HEAD:${GITHUB_REF_NAME}"

      - name: Report the new launcher tag
        id: tags
        run: |
          git tag --list 'v*' | sort > "$RUNNER_TEMP/launcher-tags-after"
          tag=$(comm -13 "$RUNNER_TEMP/launcher-tags-before" "$RUNNER_TEMP/launcher-tags-after")
          echo "launcher_tag=$tag" >> "$GITHUB_OUTPUT"

  launcher-release:
    needs: bump
    if: ${{ needs.bump.outputs.launcher_tag != '' }}
    uses: ./.github/workflows/launcher-release.yml
    with:
      tag: ${{ needs.bump.outputs.launcher_tag }}
