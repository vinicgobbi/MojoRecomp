# Builds and runs the game-independent runtime tests on Windows and Linux.
# MOJORECOMP_GUEST_IMAGE=OFF skips the translated guest image, so no game data,
# ppc/ output, or setup work tree is needed.
name: Runtime tests

on:
  pull_request:
    paths:
      - "runtime/**"
      - "version.toml"
      - ".github/workflows/runtime-tests.yml"
  push:
    branches: [main, development]
    paths:
      - "runtime/**"
      - "version.toml"
      - ".github/workflows/runtime-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The windows-clang-cl-tests preset expects the local
          # thirdparty/llvm22 toolchain, so CI uses the runner's ClangCL.
          - target: windows-x64
            os: windows-latest
            workdir: .
            configure: >-
              -S runtime -B runtime/build-ci -G "Visual Studio 17 2022" -A x64
              -T ClangCL -DMOJORECOMP_GUEST_IMAGE=OFF
            build: --build runtime/build-ci --config Release --parallel
            test: --test-dir runtime/build-ci -C Release --output-on-failure
          - target: linux-x64
            os: ubuntu-24.04
            workdir: runtime
            configure: --preset linux-clang-tests
            build: --build --preset linux-clang-tests --parallel
            test: --preset linux-clang-tests
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      # Only tomlplusplus is needed, and it is reached through XenonRecomp.
      - name: Fetch test dependencies
        run: |
          git submodule update --init --depth 1 thirdparty/XenonRecomp
          git -C thirdparty/XenonRecomp submodule update --init --depth 1 \
            thirdparty/tomlplusplus

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang ninja-build

      - name: Configure
        working-directory: ${{ matrix.workdir }}
        run: cmake ${{ matrix.configure }}

      - name: Build
        working-directory: ${{ matrix.workdir }}
        run: cmake ${{ matrix.build }}

      - name: Test
        working-directory: ${{ matrix.workdir }}
        run: ctest ${{ matrix.test }}
